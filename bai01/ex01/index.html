<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bốn mùa</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 16px;
      background: #f7f8fa;
      font-family: Georgia, "Times New Roman", serif;
    }

    .poem {
      width: min(850px, 100%);
      margin: 0 auto;
      padding: 30px;
      border: 1px solid #aaa;
      background: #fffef0;
      text-align: center;
    }

    h1 {
      margin: 0 0 24px;
      padding: 7px 12px;
      background: #fbd9e7;
      color: #d00016;
      font-size: 34px;
      line-height: 1.25;
    }

    .stanza {
      margin: 0 auto;
      font-size: 22px;
      font-style: italic;
      font-weight: 600;
      line-height: 1.55;
    }

    .blue {
      color: #064bd7;
    }

    .red {
      color: #df1010;
    }

    hr {
      width: 55%;
      margin: 20px auto;
      border: 0;
      border-top: 2px solid #7396ef;
    }

    @media (max-width: 600px) {
      body {
        padding: 20px 12px;
      }

      .poem {
        padding: 20px 14px;
      }

      h1 {
        font-size: 28px;
      }

      .stanza {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <main class="poem">
    <h1>BỐN MÙA</h1>

    <p class="stanza blue">
      Xuân về hoa nở khắp trời<br>
      Hạ sang nắng cháy rạng ngời phố quen<br>
      Thu về lá rụng bên thềm
    </p>

    <hr>

    <p class="stanza red">
      Đông sang gió lạnh bên em đợi chờ<br>
      Bốn mùa là bốn giấc mơ<br>
      Thời gian đi mãi ta chờ đợi ai
    </p>

    <hr>

    <p class="stanza blue">
      Một năm rồi lại một năm<br>
      Vẫn còn câu hát thì thầm quê hương<br>
      Chờ xuân nắng mới soi đường
    </p>
  </main>
</body>
</html>
